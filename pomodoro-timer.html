<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟 — Pomodoro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
<style>
/* ═══════════════════════════════════════════════════════════
   TYPOGRAPHY — Playfair Display (timer) + DM Sans (UI)
   Fallback: Georgia for serif, system sans-serif for UI
   ═══════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');

/* ═══════════════════════════════════════════════════════════
   THEME SYSTEM — 5 Distinctive Aesthetics
   ═══════════════════════════════════════════════════════════ */
:root {
  --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-full: 100px;
  --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
}

/* ── Observatory (Dark) — Celestial gold on deep space ── */
[data-theme="dark"] {
  --bg: #08080f;
  --bg-alt: #0c0c18;
  --surface: #141421;
  --surface-alt: #1a1a2c;
  --surface-hover: #1e1e33;
  --primary: #d4a853;
  --primary-light: #e2c278;
  --primary-glow: rgba(212,168,83,0.30);
  --work: #d4a853;
  --break: #7a9a7e;
  --long-break: #7b9bae;
  --text: #e4e0d8;
  --text-secondary: #9a9588;
  --text-muted: #5a5550;
  --ring-bg: #1c1c2e;
  --border: rgba(212,168,83,0.08);
  --border-subtle: rgba(255,255,255,0.04);
  --nav-bg: #0d0d1a;
  --input-bg: #0c0c18;
  --input-border: rgba(212,168,83,0.12);
  --danger: #c85552;
  --success: #7a9a7e;
  --shadow: 0 12px 48px rgba(0,0,0,0.6);
  --star-opacity: 0.6;
}

/* ── Dawn (Light) — Warm parchment, terracotta ── */
[data-theme="light"] {
  --bg: #faf6f0;
  --bg-alt: #f2ece4;
  --surface: #ffffff;
  --surface-alt: #faf7f3;
  --surface-hover: #f5f0e8;
  --primary: #c17d5b;
  --primary-light: #d4956e;
  --primary-glow: rgba(193,125,91,0.25);
  --work: #c17d5b;
  --break: #6b9b6d;
  --long-break: #6b8fa0;
  --text: #3d322b;
  --text-secondary: #8a7b6e;
  --text-muted: #c4b8a8;
  --ring-bg: #f0e8db;
  --border: rgba(193,125,91,0.10);
  --border-subtle: rgba(0,0,0,0.04);
  --nav-bg: #ffffff;
  --input-bg: #f5f0e8;
  --input-border: rgba(193,125,91,0.15);
  --danger: #c85552;
  --success: #6b9b6d;
  --shadow: 0 12px 48px rgba(0,0,0,0.08);
  --star-opacity: 0;
}

/* ── Forest — Deep pine, aged copper ── */
[data-theme="forest"] {
  --bg: #0b130e;
  --bg-alt: #0f1a13;
  --surface: #162019;
  --surface-alt: #1b261e;
  --surface-hover: #1f2c23;
  --primary: #b58b5c;
  --primary-light: #c9a270;
  --primary-glow: rgba(181,139,92,0.28);
  --work: #b58b5c;
  --break: #6b9b6d;
  --long-break: #6b8fa0;
  --text: #e0ddd5;
  --text-secondary: #9a988a;
  --text-muted: #5a5a4a;
  --ring-bg: #1c281e;
  --border: rgba(181,139,92,0.08);
  --border-subtle: rgba(255,255,255,0.03);
  --nav-bg: #0d150f;
  --input-bg: #0b130e;
  --input-border: rgba(181,139,92,0.12);
  --danger: #c85552;
  --success: #6b9b6d;
  --shadow: 0 12px 48px rgba(0,0,0,0.6);
  --star-opacity: 0.3;
}

/* ── Abyss (Ocean) — Bioluminescent deep sea ── */
[data-theme="ocean"] {
  --bg: #060d14;
  --bg-alt: #091420;
  --surface: #101c28;
  --surface-alt: #152230;
  --surface-hover: #192838;
  --primary: #5cc4b5;
  --primary-light: #7dd4c8;
  --primary-glow: rgba(92,196,181,0.30);
  --work: #5cc4b5;
  --break: #7a9a7e;
  --long-break: #7b9bae;
  --text: #dde8e8;
  --text-secondary: #90a8a8;
  --text-muted: #4a6065;
  --ring-bg: #182430;
  --border: rgba(92,196,181,0.08);
  --border-subtle: rgba(255,255,255,0.03);
  --nav-bg: #091018;
  --input-bg: #060d14;
  --input-border: rgba(92,196,181,0.12);
  --danger: #c85552;
  --success: #7a9a7e;
  --shadow: 0 12px 48px rgba(0,0,0,0.6);
  --star-opacity: 0.5;
}

/* ── Ember (Sunset) — Smoldering volcanic ── */
[data-theme="sunset"] {
  --bg: #0f0a08;
  --bg-alt: #15100c;
  --surface: #1c1410;
  --surface-alt: #221914;
  --surface-hover: #281e18;
  --primary: #e85d3a;
  --primary-light: #f0785a;
  --primary-glow: rgba(232,93,58,0.30);
  --work: #e85d3a;
  --break: #c49b4a;
  --long-break: #b0706a;
  --text: #e8ddd8;
  --text-secondary: #a89890;
  --text-muted: #6a5850;
  --ring-bg: #241a14;
  --border: rgba(232,93,58,0.08);
  --border-subtle: rgba(255,255,255,0.03);
  --nav-bg: #100c08;
  --input-bg: #0f0a08;
  --input-border: rgba(232,93,58,0.12);
  --danger: #c85552;
  --success: #c49b4a;
  --shadow: 0 12px 48px rgba(0,0,0,0.6);
  --star-opacity: 0.4;
}

/* ═══════════════════════════════════════════════════════════
   BASE & ATMOSPHERE
   ═══════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  overflow-x: hidden;
  transition: background 0.6s var(--ease-out), color 0.6s var(--ease-out);
  position: relative;
}

/* ── Starfield Canvas ── */
#starfield {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: var(--star-opacity);
  transition: opacity 0.6s var(--ease-out);
}

/* ── Grain Texture Overlay (SVG filter) ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 200px 200px;
}

/* ═══════════════════════════════════════════════════════════
   MAIN CONTAINER
   ═══════════════════════════════════════════════════════════ */
.app-container {
  position: relative;
  z-index: 2;
  width: 460px;
  max-width: 95vw;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow:
    0 0 120px rgba(212,168,83,0.04),
    0 0 0 1px var(--border-subtle),
    var(--shadow);
  overflow: hidden;
  transition: background 0.6s var(--ease-out), border-color 0.6s var(--ease-out), box-shadow 0.6s var(--ease-out);
  /* Page load animation */
  animation: container-rise 0.8s var(--ease-out) both;
}

@keyframes container-rise {
  from {
    opacity: 0;
    transform: translateY(24px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ── Ambient glow behind container ── */
.app-container::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: var(--radius-lg);
  padding: 1px;
  background: linear-gradient(160deg,
    rgba(212,168,83,0.15) 0%,
    transparent 40%,
    transparent 60%,
    rgba(212,168,83,0.08) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  transition: opacity 0.6s var(--ease-out);
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════════ */
.app-nav {
  display: flex;
  background: var(--nav-bg);
  border-bottom: 1px solid var(--border);
  padding: 4px 12px;
  gap: 2px;
  transition: background 0.6s var(--ease-out), border-color 0.6s var(--ease-out);
  position: relative;
  z-index: 2;
}
.nav-item {
  flex: 1;
  padding: 12px 6px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font-body);
  letter-spacing: 0.3px;
  transition: color 0.3s var(--ease-out);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.nav-item:hover { color: var(--text); }
.nav-item.active {
  color: var(--primary);
  font-weight: 600;
}
.nav-item.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 30%;
  right: 30%;
  height: 2px;
  background: var(--primary);
  border-radius: 1px;
  animation: nav-underline 0.35s var(--ease-out) both;
}
@keyframes nav-underline {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.nav-icon { font-size: 15px; }
.nav-badge {
  background: var(--primary);
  color: var(--bg);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 700;
  min-width: 18px;
  text-align: center;
  line-height: 1.2;
  letter-spacing: 0;
}

/* ═══════════════════════════════════════════════════════════
   PAGES
   ═══════════════════════════════════════════════════════════ */
.app-page {
  display: none;
  padding: 32px 28px 28px;
  min-height: 440px;
  animation: page-in 0.4s var(--ease-out) both;
}
.app-page.active { display: block; }
@keyframes page-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════════════════════
   TIMER PAGE — Mode Tabs
   ═══════════════════════════════════════════════════════════ */
.mode-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg);
  border-radius: var(--radius-full);
  padding: 4px;
  margin-bottom: 28px;
  transition: background 0.6s var(--ease-out);
}
.mode-tab {
  flex: 1;
  padding: 10px 6px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  border-radius: var(--radius-full);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font-body);
  letter-spacing: 0.2px;
  transition: all 0.35s var(--ease-out);
  position: relative;
}
.mode-tab.active {
  background: var(--primary);
  color: var(--bg);
  font-weight: 600;
  box-shadow: 0 4px 16px var(--primary-glow);
}
.mode-tab:hover:not(.active) {
  color: var(--text);
  background: rgba(128,128,128,0.06);
}

/* Active task indicator */
.active-task-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-bottom: 16px;
  font-size: 12px;
  font-family: var(--font-body);
  color: var(--text-muted);
  min-height: 20px;
  letter-spacing: 0.3px;
  transition: color 0.3s var(--ease-out);
}
.active-task-indicator.has-task {
  color: var(--primary);
  font-weight: 500;
}

/* ═══════════════════════════════════════════════════════════
   TIMER RING — The centerpiece
   ═══════════════════════════════════════════════════════════ */
.timer-ring-wrapper {
  position: relative;
  width: 250px;
  height: 250px;
  margin: 0 auto 28px;
}
.timer-ring {
  transform: rotate(-90deg);
  width: 250px;
  height: 250px;
  filter: drop-shadow(0 0 12px var(--primary-glow));
  transition: filter 0.6s var(--ease-out);
}
.timer-ring.pulse {
  filter: drop-shadow(0 0 20px var(--primary-glow));
}

.ring-bg {
  fill: none;
  stroke: var(--ring-bg);
  stroke-width: 5;
  transition: stroke 0.6s var(--ease-out);
}
.ring-progress {
  fill: none;
  stroke: var(--primary);
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.5s var(--ease-out);
  stroke-dasharray: 722.57;
  stroke-dashoffset: 0;
}
.ring-progress.paused {
  transition: stroke-dashoffset 0s, stroke 0.5s var(--ease-out);
}
.ring-progress.break-mode { stroke: var(--break); }
.ring-progress.long-break-mode { stroke: var(--long-break); }

/* ── Timer interior display ── */
.timer-display {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.timer-time {
  font-family: var(--font-display);
  font-size: 58px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 4px;
  line-height: 1;
  color: var(--text);
  transition: color 0.6s var(--ease-out);
  text-shadow: 0 0 40px rgba(212,168,83,0.15);
}
.timer-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  margin-top: 6px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  transition: color 0.3s var(--ease-out);
}

/* ═══════════════════════════════════════════════════════════
   CONTROLS
   ═══════════════════════════════════════════════════════════ */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}
.btn {
  border: none;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  transition: all 0.25s var(--ease-spring);
}
.btn:active { transform: scale(0.90); }

.btn-play {
  width: 62px; height: 62px;
  background: var(--primary);
  color: var(--bg);
  font-size: 24px;
  box-shadow: 0 6px 24px var(--primary-glow);
  transition: all 0.3s var(--ease-out);
  position: relative;
}
.btn-play::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid transparent;
  transition: border-color 0.3s var(--ease-out);
}
.btn-play:hover {
  background: var(--primary-light);
  box-shadow: 0 10px 32px var(--primary-glow);
  transform: translateY(-2px);
}
.btn-play:hover::after {
  border-color: rgba(212,168,83,0.2);
}
.btn-play:active { transform: translateY(0) scale(0.94); }
.btn-play.running {
  background: var(--primary);
  box-shadow: 0 6px 24px var(--primary-glow);
  animation: btn-pulse 3s ease-in-out infinite;
}
@keyframes btn-pulse {
  0%, 100% { box-shadow: 0 6px 24px var(--primary-glow); }
  50% { box-shadow: 0 8px 36px var(--primary-glow), 0 0 0 8px rgba(212,168,83,0.06); }
}

.btn-small {
  width: 42px; height: 42px;
  background: var(--ring-bg);
  color: var(--text-secondary);
  font-size: 16px;
  border: 1px solid transparent;
  transition: all 0.3s var(--ease-out);
}
.btn-small:hover {
  background: var(--surface-hover);
  color: var(--text);
  border-color: var(--border);
}

/* ═══════════════════════════════════════════════════════════
   MINI STATS (Timer Page)
   ═══════════════════════════════════════════════════════════ */
.mini-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--border-subtle);
  transition: border-color 0.6s var(--ease-out);
}
.mini-stat { text-align: center; }
.mini-stat-value {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
  transition: color 0.6s var(--ease-out);
}
.mini-stat-label {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

/* ═══════════════════════════════════════════════════════════
   TASKS PAGE
   ═══════════════════════════════════════════════════════════ */
#page-tasks { padding: 24px 28px 28px; }

.task-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.task-input {
  flex: 1;
  padding: 11px 14px;
  border: 1px solid var(--input-border);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-body);
  outline: none;
  transition: all 0.3s var(--ease-out);
}
.task-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(212,168,83,0.06); }
.task-input::placeholder { color: var(--text-muted); }

.btn-add {
  padding: 11px 18px;
  border: none;
  background: var(--primary);
  color: var(--bg);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font-body);
  letter-spacing: 0.2px;
  transition: all 0.3s var(--ease-out);
  white-space: nowrap;
}
.btn-add:hover { background: var(--primary-light); transform: translateY(-1px); }

.task-list { list-style: none; max-height: 310px; overflow-y: auto; }
.task-list::-webkit-scrollbar { width: 4px; }
.task-list::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.25s var(--ease-out);
}
.task-item:hover { background: var(--bg-alt); }
.task-item.active-task {
  border-color: rgba(212,168,83,0.2);
  background: var(--bg-alt);
}

.task-checkbox {
  width: 20px; height: 20px;
  border: 2px solid var(--text-muted);
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s var(--ease-out);
  font-size: 10px;
  color: transparent;
}
.task-checkbox:hover { border-color: var(--primary); }
.task-item.done .task-checkbox {
  background: var(--success);
  border-color: var(--success);
  color: var(--bg);
}
.task-item.done .task-title {
  text-decoration: line-through;
  color: var(--text-muted);
}

.task-title {
  flex: 1;
  font-size: 13px;
  font-family: var(--font-body);
  transition: color 0.25s var(--ease-out);
}
.task-pomos {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--ring-bg);
  padding: 3px 8px;
  border-radius: 12px;
  white-space: nowrap;
  transition: all 0.3s var(--ease-out);
  font-family: var(--font-mono);
}
.task-item.active-task .task-pomos { background: var(--primary); color: var(--bg); }

.task-delete {
  width: 26px; height: 26px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 50%;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s var(--ease-out);
  flex-shrink: 0;
}
.task-delete:hover { background: var(--danger); color: #fff; }

.empty-state {
  text-align: center;
  padding: 48px 20px;

<script>
/* ═══════════════════════════════════════════════
   POMODORO TIMER — Application Logic
   ═══════════════════════════════════════════════ */

// ── Starfield Background ──
(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  const stars = [];
  const STAR_COUNT = 80;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Create stars with varied properties
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.4,
      opacity: Math.random() * 0.6 + 0.2,
      twinkleSpeed: Math.random() * 0.008 + 0.003,
      twinkleOffset: Math.random() * Math.PI * 2,
      driftX: (Math.random() - 0.5) * 0.12,
      driftY: (Math.random() - 0.5) * 0.08,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const time = Date.now() * 0.001;

    for (const s of stars) {
      const twinkle = Math.sin(time * s.twinkleSpeed * 60 + s.twinkleOffset) * 0.4 + 0.6;
      const alpha = s.opacity * twinkle;

      // Drift
      s.x += s.driftX;
      s.y += s.driftY;
      if (s.x < 0) s.x = canvas.width;
      if (s.x > canvas.width) s.x = 0;
      if (s.y < 0) s.y = canvas.height;
      if (s.y > canvas.height) s.y = 0;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212,168,83,${alpha})`;
      ctx.fill();

      // Subtle glow on larger stars
      if (s.r > 1.1) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212,168,83,${alpha * 0.08})`;
        ctx.fill();
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── DOM helpers ──
const $id = id => document.getElementById(id);
const $qsa = (sel, root) => (root || document).querySelectorAll(sel);

// ── Cached DOM refs ──
const els = {
  ring: $id('ringProgress'),
  ringSvg: $id('timerRingSvg'),
  timerDisplay: $id('timerDisplay'),
  timerLabel: $id('timerLabel'),
  btnPlay: $id('btnPlay'),
  toast: $id('toast'),
  activeTask: $id('activeTaskIndicator'),
  todayCount: $id('todayCount'),
  totalCount: $id('totalCount'),
  streakCount: $id('streakCount'),
  taskList: $id('taskList'),
  taskEmpty: $id('taskEmptyState'),
  taskInput: $id('taskInput'),
  taskBadge: $id('navTaskCount'),
  chartSvg: $id('chartSvg'),
  customColor: $id('customColor'),
  statsTotalFocus: $id('statTotalFocus'),
  statsAvgDaily: $id('statAvgDaily'),
  statsBestDay: $id('statBestDay'),
  statsBestCount: $id('statBestCount'),
  statsStreak: $id('statStreak'),
  statsWeekTotal: $id('statWeekTotal'),
  statsCompletion: $id('statCompletion'),
  statsTaskInfo: $id('statTaskInfo'),
};

// ── Constants ──
const RING_CIRCUMFERENCE = 2 * Math.PI * 115; // ≈722.57
const DAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
const HISTORY_RETENTION_DAYS = 365;
const STORAGE_PREFIX = 'pomodoro_';
const STORAGE_SETTINGS = STORAGE_PREFIX + 'settings';
const STORAGE_TASKS = STORAGE_PREFIX + 'tasks';
const STORAGE_STATS = STORAGE_PREFIX + 'stats';
const STORAGE_ACTIVE_TASK = STORAGE_PREFIX + 'active_task';

const DEFAULT_SETTINGS = {
  workDuration: 25,
  breakDuration: 5,
  longBreakDuration: 15,
  longBreakInterval: 4,
  theme: 'dark',
  sound: 'chime',
  customColor: null,
};

const MODE_LABELS = { work: '专注', break: '短休', 'long-break': '长休' };
const MODE_LABELS_RUNNING = { work: '专注中...', break: '休息中...', 'long-break': '长休中...' };

// ── Audio System ──
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playTone(freq, duration, delay = 0, type = 'sine', vol = 0.3) {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  } catch (e) { /* audio not available */ }
}

const SOUND_PATTERNS = {
  chime: () => {
    [523, 659, 784, 1047].forEach((f, i) => playTone(f, 0.3, i * 0.18));
    setTimeout(() => {
      [523, 659, 784, 1047].forEach((f, i) => playTone(f, 0.3, i * 0.18));
    }, 800);
  },
  bell: () => {
    playTone(880, 0.6, 0, 'sine', 0.25);
    playTone(1100, 0.4, 0.08, 'sine', 0.15);
    setTimeout(() => playTone(880, 0.6, 0, 'sine', 0.25), 700);
  },
  digital: () => {
    [800, 1000, 800, 1000].forEach((f, i) => playTone(f, 0.12, i * 0.15, 'square', 0.15));
    setTimeout(() => {
      [800, 1000, 800, 1000].forEach((f, i) => playTone(f, 0.12, i * 0.15, 'square', 0.15));
    }, 700);
  },
  gentle: () => {
    [392, 494, 587, 784].forEach((f, i) => playTone(f, 0.5, i * 0.25, 'triangle', 0.2));
  },
  none: () => {},
};

function playAlarm() {
  const sound = settings.sound || 'chime';
  (SOUND_PATTERNS[sound] || SOUND_PATTERNS.chime)();
}

function playClick() {
  playTone(800, 0.06, 0, 'sine', 0.12);
}

// ── Toast ──
let toastTimer = null;
function showToast(msg, isBreak = false) {
  els.toast.textContent = msg;
  els.toast.className = 'toast' + (isBreak ? ' break-toast' : '');
  clearTimeout(toastTimer);
  requestAnimationFrame(() => { els.toast.classList.add('show'); });
  toastTimer = setTimeout(() => { els.toast.classList.remove('show'); }, 2500);
}

// ── Notification ──
function sendNotification(title, body) {
  if (Notification.permission === 'granted') {
    new Notification(title, { body, icon: '🍅', silent: false, tag: 'pomodoro' });
  } else if (Notification.permission === 'default') {
    Notification.requestPermission().then(p => {
      if (p === 'granted') new Notification(title, { body, icon: '🍅', tag: 'pomodoro' });
    });
  }
}

// Page visibility
let pendingNotification = null;

function showOrNotify(msg, isBreak) {
  if (document.hidden) {
    pendingNotification = { msg, isBreak };
  } else {
    showToast(msg, isBreak);
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && pendingNotification) {
    showToast(pendingNotification.msg, pendingNotification.isBreak);
    pendingNotification = null;
  }
});

// ── Data Management ──
function safeGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}

function safeSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// ── Settings ──
let settings = { ...DEFAULT_SETTINGS, ...safeGet(STORAGE_SETTINGS, {}) };
function saveSettings() { safeSet(STORAGE_SETTINGS, settings); }

// ── Tasks ──
let tasks = safeGet(STORAGE_TASKS, []);
let activeTaskId = safeGet(STORAGE_ACTIVE_TASK, null);
function saveTasks() { safeSet(STORAGE_TASKS, tasks); }
function saveActiveTask() { safeSet(STORAGE_ACTIVE_TASK, activeTaskId); }

function getActiveTask() {
  return tasks.find(t => t.id === activeTaskId) || null;
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ── Stats ──
let _statsCache = null;

function getStats() {
  if (_statsCache) return _statsCache;
  _statsCache = safeGet(STORAGE_STATS, { total: 0, streak: 0, lastDate: null, history: {} });
  return _statsCache;
}

function saveStats(stats) {
  const cutoff = getDateDaysAgo(HISTORY_RETENTION_DAYS);
  for (const date of Object.keys(stats.history)) {
    if (date < cutoff) delete stats.history[date];
  }
  _statsCache = null;
  safeSet(STORAGE_STATS, stats);
}

function getToday() { return new Date().toISOString().slice(0, 10); }

function getDateDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

// ── Timer State ──
let currentMode = 'work';
let timeLeft = settings.workDuration * 60;
let isRunning = false;
let timerInterval = null;
let completedPomodoros = 0;
let currentPage = 'timer';

// ── Navigation ──
function navigateTo(page) {
  playClick();
  currentPage = page;
  $qsa('.app-page').forEach(p => p.classList.remove('active'));
  $qsa('.nav-item').forEach(n => n.classList.remove('active'));

  const pageEl = $id('page-' + page);
  const navEl = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (pageEl) {
    pageEl.classList.add('active');
    // Re-trigger page-in animation
    pageEl.style.animation = 'none';
    pageEl.offsetHeight;
    pageEl.style.animation = '';
  }
  if (navEl) navEl.classList.add('active');

  if (page === 'tasks') renderTasks();
  if (page === 'stats') renderStats();
  if (page === 'settings') syncSettingsToInputs();
}

$qsa('.nav-item').forEach(item => {
  item.addEventListener('click', () => navigateTo(item.dataset.page));
});

// ── Task Management ──
function addTask(title) {
  const task = {
    id: generateId(),
    title: title.trim(),
    done: false,
    pomodoros: 0,
    createdAt: getToday(),
  };
  tasks.unshift(task);
  saveTasks();
  renderTasks();
  updateTaskBadge();
}

function removeTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  if (activeTaskId === id) {
    activeTaskId = null;
    saveActiveTask();
    updateActiveTaskIndicator();
  }
  saveTasks();
  renderTasks();
  updateTaskBadge();
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.done = !task.done;
    saveTasks();
    renderTasks();
    updateTaskBadge();
  }
}

function selectTask(id) {
  if (activeTaskId === id) {
    activeTaskId = null;
  } else {
    const task = tasks.find(t => t.id === id);
    if (task && !task.done) {
      activeTaskId = id;
    }
  }
  saveActiveTask();
  updateActiveTaskIndicator();
  renderTasks();
}

function incrementTaskPomodoro(id) {
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.pomodoros++;
    saveTasks();
    renderTasks();
    updateTaskBadge();
  }
}

function updateActiveTaskIndicator() {
  const task = getActiveTask();
  if (task) {
    els.activeTask.textContent = '🎯 ' + task.title;
    els.activeTask.className = 'active-task-indicator has-task';
  } else {
    els.activeTask.textContent = '未选择任务';
    els.activeTask.className = 'active-task-indicator';
  }
}

function updateTaskBadge() {
  const active = tasks.filter(t => !t.done).length;
  if (active > 0) {
    els.taskBadge.textContent = active;
    els.taskBadge.style.display = '';
  } else {
    els.taskBadge.style.display = 'none';
  }
}

// Event delegation on task list
els.taskList.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const { action, id } = target.dataset;
  if (action === 'toggle') { e.stopPropagation(); toggleTask(id); }
  else if (action === 'select') { selectTask(id); }
  else if (action === 'delete') {
    e.stopPropagation();
    if (confirm('确定删除这个任务吗？')) removeTask(id);
  }
});

function renderTasks() {
  if (tasks.length === 0) {
    els.taskList.innerHTML = '';
    els.taskEmpty.style.display = 'block';
    return;
  }

  els.taskEmpty.style.display = 'none';
  els.taskList.innerHTML = tasks.map(t => `
    <li class="task-item${t.done ? ' done' : ''}${t.id === activeTaskId ? ' active-task' : ''}">
      <div class="task-checkbox" data-action="toggle" data-id="${t.id}">${t.done ? '✓' : ''}</div>
      <span class="task-title" data-action="select" data-id="${t.id}">${escapeHtml(t.title)}</span>
      <span class="task-pomos">🍅×${t.pomodoros}</span>
      <button class="task-delete" data-action="delete" data-id="${t.id}" title="删除">×</button>
    </li>
  `).join('');
}

const _escapeDiv = document.createElement('div');
function escapeHtml(str) {
  _escapeDiv.textContent = str;
  return _escapeDiv.innerHTML;
}

// ── Statistics & Chart ──
let statsRange = 7;

function renderStats() {
  renderChart();
  renderSummaryCards();
}

function renderChart() {
  const stats = getStats();
  const days = statsRange;

  const data = [];
  for (let i = days - 1; i >= 0; i--) {
    const date = getDateDaysAgo(i);
    const d = new Date(date);
    data.push({
      label: days <= 7 ? DAY_NAMES[d.getDay()] : String(d.getMonth() + 1 + '/' + d.getDate()),
      value: stats.history[date] || 0,
      isToday: date === getToday(),
      date: date,
    });
  }

  let displayData = data;
  if (days > 7) {
    displayData = [];
    const groupSize = Math.ceil(data.length / 10);
    for (let i = 0; i < data.length; i += groupSize) {
      const group = data.slice(i, i + groupSize);
      displayData.push({
        label: group[0].label,
        value: group.reduce((s, d) => s + d.value, 0),
        isToday: group.some(d => d.isToday),
        date: group.map(d => d.date).join(','),
      });
    }
  }

  let maxVal = 1;
  for (const d of displayData) { if (d.value > maxVal) maxVal = d.value; }
  const padding = { top: 25, bottom: 30, left: 30, right: 15 };
  const chartW = 380 - padding.left - padding.right;
  const chartH = 180 - padding.top - padding.bottom;
  const barWidth = Math.max(7, Math.min(30, (chartW / displayData.length) - 4));
  const barGap = (chartW - barWidth * displayData.length) / (displayData.length + 1);

  let gridHtml = '';
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + chartH * (1 - i / 4);
    const val = Math.round(maxVal * i / 4);
    gridHtml += `<line x1="${padding.left}" y1="${y}" x2="${padding.left + chartW}" y2="${y}" stroke="var(--border-subtle)" stroke-width="0.5"/>`;
    gridHtml += `<text x="${padding.left - 6}" y="${y + 4}" text-anchor="end" fill="var(--text-muted)" font-size="10">${val}</text>`;
  }

  let barsHtml = '';
  displayData.forEach((d, i) => {
    const barH = maxVal > 0 ? (d.value / maxVal) * chartH : 0;
    const x = padding.left + barGap + i * (barWidth + barGap);
    const y = padding.top + chartH - barH;
    const fill = d.isToday ? 'var(--primary)' : 'var(--text-muted)';
    const rx = Math.min(4, barWidth / 2);

    barsHtml += `<rect class="chart-bar${d.isToday ? ' today' : ''}" x="${x}" y="${y}" width="${barWidth}" height="${Math.max(barH, d.value > 0 ? 2 : 0)}" rx="${rx}" fill="${fill}" data-value="${d.value}" data-label="${d.label}"/>`;
    if (d.value > 0) {
      barsHtml += `<text x="${x + barWidth / 2}" y="${y - 6}" text-anchor="middle" fill="var(--text-secondary)" font-size="10" font-weight="600">${d.value}</text>`;
    }
    barsHtml += `<text x="${x + barWidth / 2}" y="${padding.top + chartH + 16}" text-anchor="middle" fill="${d.isToday ? 'var(--primary)' : 'var(--text-muted)'}" font-size="10" font-weight="${d.isToday ? '600' : '400'}">${d.label}</text>`;
  });

  els.chartSvg.innerHTML = gridHtml + barsHtml;
}

function formatMinutes(mins, prefix) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  const tail = h + 'h' + (m > 0 ? ' ' + m + 'm' : '');
  return prefix ? prefix + ' ' + tail : tail;
}

function renderSummaryCards() {
  const stats = getStats();
  const today = getToday();

  const totalMinutes = stats.total * settings.workDuration;
  els.statsTotalFocus.textContent = formatMinutes(totalMinutes);

  const datesWithData = Object.keys(stats.history).filter(d => stats.history[d] > 0).length;
  const avgDaily = datesWithData > 0 ? Math.round(totalMinutes / datesWithData) : 0;
  els.statsAvgDaily.textContent = formatMinutes(avgDaily, '日均');

  let bestDate = null, bestCount = 0;
  for (const [date, count] of Object.entries(stats.history)) {
    if (count > bestCount) { bestCount = count; bestDate = date; }
  }
  if (bestDate) {
    const d = new Date(bestDate);
    els.statsBestDay.textContent = (d.getMonth() + 1) + '/' + d.getDate();
    els.statsBestCount.textContent = bestCount + ' 个番茄';
  }

  els.statsStreak.textContent = stats.streak;

  let weekTotal = 0;
  for (let i = 0; i < 7; i++) {
    weekTotal += (stats.history[getDateDaysAgo(i)] || 0);
  }
  els.statsWeekTotal.textContent = '本周 ' + weekTotal + ' 个';

  const totalTasks = tasks.length;
  const doneTasks = tasks.filter(t => t.done).length;
  const rate = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
  els.statsCompletion.textContent = rate + '%';
  els.statsTaskInfo.textContent = doneTasks + '/' + totalTasks + ' 任务';
}

// ── Timer Core ──
function getDurationForMode(mode) {
  if (mode === 'work') return settings.workDuration * 60;
  if (mode === 'break') return settings.breakDuration * 60;
  return settings.longBreakDuration * 60;
}

function switchMode(mode) {
  currentMode = mode;
  timeLeft = getDurationForMode(mode);
  updateDisplay();
  updateModeTabs();
  updateRingColor();
  els.timerLabel.textContent = MODE_LABELS[mode];
}

function updateModeTabs() {
  $qsa('.mode-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.mode === currentMode);
  });
}

function updateRingColor() {
  els.ring.classList.remove('break-mode', 'long-break-mode');
  if (currentMode === 'break') els.ring.classList.add('break-mode');
  if (currentMode === 'long-break') els.ring.classList.add('long-break-mode');
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function updateDisplay() {
  els.timerDisplay.textContent = formatTime(timeLeft);
  const dur = getDurationForMode(currentMode);
  const progress = dur > 0 ? timeLeft / dur : 1;
  els.ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);
  updatePageTitle();
}

function updatePageTitle() {
  if (isRunning) {
    document.title = currentMode === 'work'
      ? `🍅 ${formatTime(timeLeft)} — 专注`
      : `☕ ${formatTime(timeLeft)} — 休息`;
  } else {
    document.title = '🍅 番茄钟';
  }
}

function updatePlayButton() {
  if (isRunning) {
    els.btnPlay.textContent = '⏸';
    els.btnPlay.classList.add('running');
    els.ringSvg.classList.add('pulse');
  } else {
    els.btnPlay.textContent = '▶';
    els.btnPlay.classList.remove('running');
    els.ringSvg.classList.remove('pulse');
  }
}

function toggleTimer() {
  if (isRunning) pauseTimer(); else startTimer();
}

function startTimer() {
  if (isRunning) return;
  isRunning = true;
  els.ring.classList.remove('paused');
  updatePlayButton();
  els.timerLabel.textContent = MODE_LABELS_RUNNING[currentMode];
  updatePageTitle();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateDisplay();
    if (timeLeft <= 0) timerComplete();
  }, 1000);
}

function pauseTimer() {
  if (!isRunning) return;
  isRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  els.ring.classList.add('paused');
  updatePlayButton();
  els.timerLabel.textContent = '已暂停';
  document.title = '⏸ 已暂停';
}

function resetTimer() {
  pauseTimer();
  timeLeft = getDurationForMode(currentMode);
  updateDisplay();
  els.timerLabel.textContent = MODE_LABELS[currentMode];
  document.title = '🍅 番茄钟';
}

function skipTimer() {
  pauseTimer();
  timerComplete();
}

function timerComplete() {
  pauseTimer();
  playAlarm();

  const wasWork = currentMode === 'work';

  if (wasWork) {
    completedPomodoros++;
    recordPomodoro();
    if (activeTaskId) incrementTaskPomodoro(activeTaskId);

    showOrNotify(`🎉 第 ${completedPomodoros} 个番茄完成！`, false);
    sendNotification('🍅 番茄钟完成！', `专注 ${settings.workDuration} 分钟完成，该休息一下了~`);

    if (completedPomodoros % settings.longBreakInterval === 0) {
      switchMode('long-break');
      showOrNotify('🌴 长休时间！', true);
    } else {
      switchMode('break');
    }
  } else {
    showOrNotify('⏰ 休息结束，开始专注吧！', true);
    sendNotification('⏰ 休息结束', '准备好开始下一个番茄了吗？');
    switchMode('work');
  }

  updateDisplay();
}

function recordPomodoro() {
  const stats = getStats();
  const today = getToday();
  stats.total++;
  stats.history[today] = (stats.history[today] || 0) + 1;

  const yesterday = getDateDaysAgo(1);
  if (stats.lastDate === today) {
    // Already counted today
  } else if (stats.lastDate === yesterday) {
    stats.streak++;
  } else if (stats.lastDate !== today) {
    stats.streak = 1;
  }
  stats.lastDate = today;
  saveStats(stats);
  updateMiniStats(stats);
  if (currentPage === 'stats') renderStats();
}

function updateMiniStats(stats) {
  stats = stats || getStats();
  const today = getToday();
  els.todayCount.textContent = stats.history[today] || 0;
  els.totalCount.textContent = stats.total;
  els.streakCount.textContent = stats.streak;
}

// ── Theme Management ──
function applyTheme(theme, skipSave) {
  settings.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);

  $qsa('.theme-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.theme === theme);
  });

  applyCustomColor(settings.customColor, true);
  if (!skipSave) saveSettings();
}

function applyCustomColor(color, skipSave) {
  if (color) {
    settings.customColor = color;
    document.documentElement.style.setProperty('--primary', color);
    document.documentElement.style.setProperty('--primary-glow', hexToRgba(color, 0.30));
    els.customColor.value = color;
  } else {
    settings.customColor = null;
    document.documentElement.style.removeProperty('--primary');
    document.documentElement.style.removeProperty('--primary-glow');
    els.customColor.value = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
  }
  if (!skipSave) saveSettings();
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Sync Settings to UI ──
function syncSettingsToInputs() {
  $qsa('[data-setting]').forEach(el => {
    el.value = settings[el.dataset.setting];
  });

  $qsa('.theme-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.theme === settings.theme);
  });

  $qsa('.sound-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.sound === settings.sound);
  });

  els.customColor.value = settings.customColor || getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
}

// Settings inputs
$qsa('[data-setting]').forEach(input => {
  input.addEventListener('change', () => {
    const key = input.dataset.setting;
    const val = parseInt(input.value, 10);
    if (isNaN(val) || val < parseInt(input.min, 10) || val > parseInt(input.max, 10)) {
      input.value = settings[key];
      return;
    }
    settings[key] = val;
    saveSettings();

    const modeMap = { workDuration: 'work', breakDuration: 'break', longBreakDuration: 'long-break' };
    if (modeMap[key] === currentMode) resetTimer();
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      toggleTimer();
      break;
    case 'KeyR':
      if (!e.ctrlKey && !e.metaKey) resetTimer();
      break;
    case 'Digit1': switchMode('work'); break;
    case 'Digit2': switchMode('break'); break;
    case 'Digit3': switchMode('long-break'); break;
    case 'KeyT':
      if (!e.ctrlKey && !e.metaKey) navigateTo('tasks');
      break;
    case 'KeyS':
      if (!e.ctrlKey && !e.metaKey) navigateTo('stats');
      break;
    case 'Escape':
      navigateTo('timer');
      break;
  }
});

// ── Initialization ──
function init() {
  applyTheme(settings.theme || 'dark', true);
  if (settings.customColor) {
    applyCustomColor(settings.customColor, true);
  }
  saveSettings();

  syncSettingsToInputs();
  switchMode('work');
  updateMiniStats();
  updateActiveTaskIndicator();
  updateTaskBadge();

  const stats = getStats();
  const today = getToday();
  if (stats.lastDate && stats.lastDate !== today) {
    const last = new Date(stats.lastDate);
    const todayDate = new Date(today);
    const diffDays = Math.floor((todayDate - last) / 86400000);
    if (diffDays > 1) {
      stats.streak = 0;
      saveStats(stats);
      updateMiniStats(stats);
    }
  }

  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

init();
</script>
</body>
</html>
